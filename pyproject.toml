[project]
name = "cordon-effect"
version = "0.1.0"
description = "Difference-in-differences and synthetic-control estimates of NYC congestion pricing on recorded for-hire trips"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "polars>=1.30,<2",
    "pyproj>=3.6,<4",
    "pyshp>=2.3,<4",
    "scipy>=1.13,<2",
    "shapely>=2.0,<3",
    "statsmodels>=0.14,<0.15",
]

[project.scripts]
cordon = "cordon.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cordon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:Appender is deprecated"]
